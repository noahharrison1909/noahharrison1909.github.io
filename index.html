<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harrison Library</title>
  <meta name="description" content="Mine projekter, beregninger og ting jeg undersøger.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6fdb'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='serif'>∑</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      const t = JSON.parse(localStorage.getItem("hl-theme"));
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn mobile-only" title="Menu">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
    </button>
    <a href="#/" class="brand"><span class="logo">∑</span><span class="brand-name">Harrison Library</span></a>
    <button id="searchBtn" class="search-trigger">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      <span class="hide-sm">Søg i biblioteket…</span>
      <kbd class="hide-sm">⌘K</kbd>
    </button>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" title="Skift tema"></button>
      <div id="authActions" class="row"></div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar"><div id="sidebarBody"></div></aside>
    <div id="scrim"></div>
    <main id="view" class="view"><div class="muted pad">Indlæser biblioteket…</div></main>
  </div>

  <div id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
